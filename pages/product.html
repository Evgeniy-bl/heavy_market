<!DOCTYPE html>
<html lang="ru" class="is-preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар — Heavy Market</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/accessibility.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/preloader.css">
  <link rel="stylesheet" href="../css/pages/catalog.css">
  <link rel="stylesheet" href="../css/pages/product.css">
  <script src="../js/common/theme-switcher.js"></script>
</head>
<body data-page="product">

  <div id="preloader" class="preloader" role="status" aria-live="polite" aria-busy="true">
    <div class="preloader__inner">
      <div class="preloader__logo" aria-hidden="true">HEAVY</div>
      <div class="preloader__spinner" aria-hidden="true"></div>
      <p class="preloader__text">Загрузка...</p>
    </div>
  </div>

    <div data-site-header></div>

<main class="product-page">
    <div class="container" id="product-content"></div>
  </main>

    <div data-site-footer></div>

<div class="modal" data-modal="auth-required" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="auth-required-title">
    <div class="modal__backdrop" data-modal-close></div>
    <section class="modal__dialog">
      <button class="modal__close" type="button" data-modal-close data-i18n-aria="common.close">×</button>
      <h2 class="modal__title" id="auth-required-title" data-i18n="auth.profileModal.title">Войдите в аккаунт</h2>
      <p class="modal__text" data-auth-modal-message data-i18n="auth.profileModal.message">Чтобы открыть личный кабинет, войдите или зарегистрируйтесь</p>
      <div class="modal__actions modal__actions--stack">
        <a href="login.html" class="btn btn--primary btn--full" data-i18n="auth.login.submit">Войти</a>
        <a href="register.html" class="btn btn--secondary btn--full" data-i18n="auth.register.submit">Зарегистрироваться</a>
      </div>
    </section>
  </div>

  <div class="modal modal--product-gallery" data-modal="product-gallery" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Галерея фото">
    <section class="modal__dialog product-gallery-lightbox">
      <header class="product-gallery-lightbox__top">
        <p class="product-gallery-lightbox__title" data-gallery-lightbox-title></p>
        <button type="button" class="product-gallery-lightbox__btn product-gallery-lightbox__btn--close" data-modal-close data-i18n-aria="common.close" aria-label="Закрыть">×</button>
      </header>
      <div class="product-gallery-lightbox__viewport">
        <button type="button" class="product-gallery-lightbox__nav product-gallery-lightbox__nav--prev" data-gallery-lightbox-prev aria-label="Previous"></button>
        <div class="product-gallery-lightbox__frame">
          <img class="product-gallery-lightbox__image" src="" alt="" data-gallery-lightbox-image>
          <span class="product-gallery-lightbox__counter" data-gallery-lightbox-counter></span>
        </div>
        <button type="button" class="product-gallery-lightbox__nav product-gallery-lightbox__nav--next" data-gallery-lightbox-next aria-label="Next"></button>
      </div>
      <div class="product-gallery-lightbox__thumbs" data-gallery-lightbox-thumbs></div>
    </section>
  </div>

  <div class="modal modal--seller-phone" data-modal="seller-phone" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="seller-phone-title">
    <div class="modal__backdrop" data-modal-close></div>
    <section class="modal__dialog">
      <button class="modal__close" type="button" data-modal-close data-i18n-aria="common.close">×</button>
      <div class="seller-phone-sheet">
        <h2 class="seller-phone-sheet__name" id="seller-phone-title" data-seller-phone-name></h2>
        <a class="seller-phone-sheet__phone" data-seller-phone-link href="">
          <img class="seller-phone-sheet__icon" src="../assets/icons/phone.svg" alt="" width="22" height="22" aria-hidden="true">
          <span data-seller-phone-number></span>
        </a>
      </div>
    </section>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/pages/product.js"></script>
</body>
</html>
