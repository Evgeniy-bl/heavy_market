<!DOCTYPE html>
<html lang="ru" class="is-preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ — Heavy Market</title>

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/accessibility.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/preloader.css">
  <link rel="stylesheet" href="../css/pages/admin.css">

  <script src="../js/common/theme-switcher.js"></script>
</head>
<body data-page="admin">

  <div id="preloader" class="preloader" role="status" aria-live="polite" aria-busy="true">
    <div class="preloader__inner">
      <div class="preloader__logo" aria-hidden="true">HEAVY</div>
      <div class="preloader__spinner" aria-hidden="true"></div>
      <p class="preloader__text">Загрузка...</p>
    </div>
  </div>

  <div data-site-header></div>

  <main class="admin-page">
    <section class="admin-hero">
      <div class="container">
        <p class="admin-hero__eyebrow" data-i18n="admin.eyebrow">Панель администратора</p>
        <h1 class="admin-hero__title" data-i18n="admin.title">Модерация объявлений</h1>
        <p class="admin-hero__text" data-i18n="admin.subtitle">Просматривайте новые объявления и подтверждайте публикацию в каталоге.</p>
      </div>
    </section>

    <div class="container admin-page__content">
      <div class="admin-stats" data-admin-stats>
        <div class="admin-stats__item">
          <span class="admin-stats__value" data-stat-pending>0</span>
          <span class="admin-stats__label" data-i18n="admin.statPending">На модерации</span>
        </div>

        <div class="admin-stats__item">
          <span class="admin-stats__value" data-stat-published>0</span>
          <span class="admin-stats__label" data-i18n="admin.statPublished">Опубликовано</span>
        </div>

        <div class="admin-stats__item">
          <span class="admin-stats__value" data-stat-rejected>0</span>
          <span class="admin-stats__label" data-i18n="admin.statRejected">Отклонено</span>
        </div>
      </div>

      <div class="admin-toolbar">
        <div class="admin-tabs" role="tablist">
          <button type="button" class="admin-tabs__btn is-active" data-admin-tab="pending" data-i18n="admin.tabPending">На модерации</button>
          <button type="button" class="admin-tabs__btn" data-admin-tab="published" data-i18n="admin.tabPublished">Опубликованные</button>
          <button type="button" class="admin-tabs__btn" data-admin-tab="rejected" data-i18n="admin.tabRejected">Отклонённые</button>
        </div>

        <label class="admin-search">
          <span class="visually-hidden" data-i18n="admin.search">Поиск</span>
          <input type="search" data-admin-search data-i18n-placeholder="admin.searchPlaceholder" placeholder="Поиск по названию или городу">
        </label>
      </div>

      <p class="admin-empty" data-admin-empty hidden data-i18n="admin.emptyPending">Нет объявлений на модерации</p>

      <div class="admin-list" data-admin-list role="list"></div>
    </div>
  </main>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/pages/admin.js"></script>
</body>
</html>
