<!DOCTYPE html>
<html lang="ru" class="is-preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой профиль — Heavy Market</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/accessibility.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/preloader.css">
  <link rel="stylesheet" href="../css/pages/profile.css">
  <script src="../js/common/theme-switcher.js"></script>
</head>
<body data-page="profile">

  <div id="preloader" class="preloader" role="status" aria-live="polite" aria-busy="true">
    <div class="preloader__inner">
      <div class="preloader__logo" aria-hidden="true">HEAVY</div>
      <div class="preloader__spinner" aria-hidden="true"></div>
      <p class="preloader__text">Загрузка...</p>
    </div>
  </div>

  <div data-site-header></div>

  <main class="profile-page profile-page--hub">
    <div class="container profile-hub">
      <header class="profile-hub__head">
        <div class="profile-hub__avatar" aria-hidden="true">
          <span class="profile-hub__initials" data-profile-hub-initials>HM</span>
        </div>
        <div class="profile-hub__identity">
          <h1 class="profile-hub__name" data-profile-hub-name data-i18n="profile.hubTitle">Мой профиль</h1>
          <p class="profile-hub__meta" data-profile-hub-meta></p>
        </div>
      </header>

      <nav class="profile-hub-menu" aria-label="Разделы кабинета">
        <a href="create-listing.html" class="profile-hub-menu__item profile-hub-menu__item--accent" data-profile-hub-add-listing hidden>
          <img class="profile-hub-menu__icon" src="../assets/icons/nav-plus.svg" alt="" width="24" height="24" aria-hidden="true">
          <span class="profile-hub-menu__label" data-i18n="nav.fabAdd">Подать объявление</span>
        </a>
        <a href="seller.html" class="profile-hub-menu__item profile-hub-menu__item--accent" data-profile-hub-become-seller hidden>
          <img class="profile-hub-menu__icon" src="../assets/icons/nav-plus.svg" alt="" width="24" height="24" aria-hidden="true">
          <span class="profile-hub-menu__label" data-i18n="header.becomeSeller">Стать продавцом</span>
        </a>

        <a href="my-listings.html" class="profile-hub-menu__item" data-profile-hub-listings hidden>
          <img class="profile-hub-menu__icon" src="../assets/icons/nav-listings.svg" alt="" width="24" height="24" aria-hidden="true">
          <span class="profile-hub-menu__label" data-i18n="profile.myListings">Мои объявления</span>
        </a>
        <a href="favorites.html" class="profile-hub-menu__item">
          <img class="profile-hub-menu__icon" src="../assets/icons/nav-heart.svg" alt="" width="24" height="24" aria-hidden="true">
          <span class="profile-hub-menu__label" data-i18n="profile.favorites">Избранное</span>
        </a>
        <a href="messages.html" class="profile-hub-menu__item profile-hub-menu__item--messages">
          <span class="profile-hub-menu__icon-wrap">
            <img class="profile-hub-menu__icon" src="../assets/icons/nav-messages.svg" alt="" width="24" height="24" aria-hidden="true">
            <span class="profile-hub-menu__badge" data-messages-badge hidden aria-hidden="true">
              <span data-messages-badge-short></span>
            </span>
          </span>
          <span class="profile-hub-menu__label" data-i18n="profile.messages">Сообщения</span>
        </a>
        <a href="profile-settings.html" class="profile-hub-menu__item">
          <img class="profile-hub-menu__icon" src="../assets/icons/settings.svg" alt="" width="24" height="24" aria-hidden="true">
          <span class="profile-hub-menu__label" data-i18n="profile.settingsTitle">Настройки профиля</span>
        </a>

        <button type="button" class="profile-hub-menu__item profile-hub-menu__item--logout" data-profile-logout>
          <span class="profile-hub-menu__label" data-i18n="profile.logout">Выйти из аккаунта</span>
        </button>
      </nav>
    </div>
  </main>

  <div data-site-footer></div>

  <div class="modal" data-modal="auth-required" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="auth-required-title">
    <div class="modal__backdrop" data-modal-close></div>
    <section class="modal__dialog">
      <button class="modal__close" type="button" data-modal-close data-i18n-aria="common.close">×</button>
      <h2 class="modal__title" id="auth-required-title" data-i18n="auth.profileModal.title">Войдите в аккаунт</h2>
      <p class="modal__text" data-auth-modal-message data-i18n="auth.profileModal.message">Чтобы открыть личный кабинет, войдите или зарегистрируйтесь</p>
      <div class="modal__actions modal__actions--stack">
        <a href="login.html" class="btn btn--primary btn--full" data-i18n="auth.login.submit">Войти</a>
        <a href="register.html" class="btn btn--secondary btn--full" data-i18n="auth.register.submit">Зарегистрироваться</a>
      </div>
    </section>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/pages/profile-hub.js"></script>
</body>
</html>
